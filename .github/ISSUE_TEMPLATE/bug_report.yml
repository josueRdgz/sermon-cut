name: Bug report
description: Report a problem with local install, render, or UI
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do **not** attach personal sermon videos,
        transcripts, API keys, or SQLite databases.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "Output of `python -m app.cli doctor` (paste text, redact paths if needed)"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / error codes
      description: Backend stderr, `code` from API errors, FFmpeg command snippet if relevant
    validations:
      required: false
