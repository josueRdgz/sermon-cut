name: Feature request
description: Suggest an improvement for Sermon Cut / Sermon Clips
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need is unmet?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work? Keep local-first and no Docker in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints you accept
      options:
        - label: No automatic publishing to social networks without an explicit future design
        - label: No commercial music catalogues / auto-download of audio
        - label: Must keep working without a Gemini API key
