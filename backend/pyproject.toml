[project]
name = "sermon-cut-backend"
version = "0.1.0"
description = "Backend for Sermon Cut: turn sermon videos into vertical shorts/reels."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",  # required for UploadFile / multipart form uploads
    "pillow>=10.3",  # renders the mandatory end card locally (no browser)
    "qrcode>=7.4",  # optional QR on the end card, generated offline
]

[project.optional-dependencies]
# Local speech-to-text. Heavy (pulls ctranslate2 + model downloads on first use).
# Install explicitly with:  pip install -e ".[whisper]"
whisper = [
    "faster-whisper>=1.0",
]
# Optional Gemini analysis. Install with:  pip install -e ".[gemini]"
gemini = [
    "google-genai>=1.0",
]
# Optional subject tracking for vertical reframing. Install with: pip install -e ".[tracking]"
tracking = [
    "opencv-python-headless>=4.9",
]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI Depends()/File() in defaults is the recommended pattern.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402", "I001"]
# Migrations follow Alembic's generated template (import order, long sa.Enum lines).
"alembic/versions/**" = ["E501", "I001"]
"tests/**" = ["E501"]
